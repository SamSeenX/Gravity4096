<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="60%" stop-color="#0c071a"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#9333ea" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  
  <!-- Deep Cosmic Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  
  <!-- Swirling Orbit Ring -->
  <ellipse cx="128" cy="128" rx="88" ry="46" transform="rotate(-25 128 128)" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 8" stroke-opacity="0.6"/>
  
  <!-- Galactic Core Glow -->
  <circle cx="128" cy="128" r="54" fill="url(#coreGlow)"/>
  <circle cx="128" cy="128" r="22" fill="#05030a" stroke="#c084fc" stroke-width="3"/>
  
  <!-- Orbiting Celestial Body -->
  <circle cx="186" cy="98" r="20" fill="url(#orbGrad)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="186" y="103" font-family="'Outfit', system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4096</text>
  
  <!-- Tiny Stardust -->
  <circle cx="70" cy="80" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="82" cy="170" r="2.5" fill="#c084fc" opacity="0.8"/>
  <circle cx="190" cy="180" r="1.5" fill="#38bdf8" opacity="0.6"/>
</svg>
